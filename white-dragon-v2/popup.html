<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白龙娘设置</title><link rel="stylesheet" href="popup.css"></head><body><header><img src="assets/icon.png" alt="白龙娘"><div><h1>白龙娘 · 网页伴侣</h1><p>V2.0 · 原创动画素材已内置</p></div></header><section><label>显示白龙娘<input type="checkbox" id="visible"></label><label>角色动画<input type="checkbox" id="motion"></label><label>跟随鼠标方向<input type="checkbox" id="follow"></label><label>互动气泡<input type="checkbox" id="bubbles"></label><label>偶尔主动打招呼<input type="checkbox" id="chatter"></label><label>聊天状态标签<input type="checkbox" id="status"></label><label class="size">角色高度 <output id="sizeValue"></output><input type="range" id="size" min="120" max="520" step="10"></label><button id="reset">恢复默认位置与大小</button></section><section class="note"><strong>操作方式</strong><p>单击互动 · 双击对话 · 拖动移动<br>悬停显示工具栏。隐藏后可在此恢复。</p><p>本地闲聊使用预设台词。面板里的「发给 ChatGPT」会发送到当前聊天，不需要 API Key。</p><p id="message" role="status"></p></section><footer>仅在 ChatGPT 网页生效 · 不向第三方上传数据</footer><script src="popup.js"></script></body></html>
